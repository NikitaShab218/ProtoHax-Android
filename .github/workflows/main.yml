name: Build ProtoHax APK

on:
  push:
    branches: [ stable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Проверяем основной репозиторий ProtoHax-Android
    - name: Checkout ProtoHax-Android
      uses: actions/checkout@v4
      with:
        submodules: false

    # 2. Устанавливаем JDK 11
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 3. Даем права на выполнение gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Клонируем ProtoHax с субмодулями, применяя токен ко всем HTTPS-запросам
    - name: Clone ProtoHax with submodules
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        # Настраиваем Git для использования токена во всех HTTPS-запросах к GitHub
        git config --global url."https://${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
        git clone --recurse-submodules https://github.com/hax0r31337/ProtoHax.git ../ProtoHax
        cd ../ProtoHax
        ./gradlew publishToMavenLocal

    # 5. Собираем APK
    - name: Build APK
      run: ./gradlew assembleDebug

    # 6. Загружаем APK как артефакт
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ProtoHax-Android-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
