name: Build ProtoHax APK

on:
  push:
    branches: [ stable ] # Укажите ветку, например 'stable', или замените на нужную
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Клонируем репозиторий
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Устанавливаем JDK 11
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 3. Даем права на выполнение gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Собираем ProtoHax (основной модуль) и публикуем в локальный Maven
    - name: Build ProtoHax core
      run: |
        cd ../
        git clone --recurse-submodules https://github.com/hax0r31337/ProtoHax.git
        cd ProtoHax
        ./gradlew publishToMaven *publishToMavenLocal*

    # 5. Собираем APK
    - name: Build APK
      run: |
        ./gradlew assembleDebug
      working-directory: ./ProtoHax-Android

    # 6. Загружаем APK как артефакт
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ProtoHax-Android-Debug
        path: ./ProtoHax-Android/app/build/outputs/apk/debug/app-debug.apk
